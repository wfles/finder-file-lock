<h2>Finder File Lock</h2>
<p>为当前账户安装「文件加锁」和「解除编辑限制」。适用于 macOS 15 或更新版本，以及 Apple 芯片和 Intel Mac。</p>
<p>在访达中选中文件后，使用右键「快速操作」，或按 ⇧⌘L 加锁、⇧⌘U 解除编辑限制。访达的「资源库」和「实用工具」默认组合键将加上 ⌥。安装会重新载入访达，请先等文件复制完成。</p>
<p>安装会保留已有自定义快捷键。如果之前通过其他方式安装了同名快速操作，请先移开旧工作流。</p>
