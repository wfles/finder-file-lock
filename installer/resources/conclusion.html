<h2>从访达使用</h2>
<p>选中一份或多份 PDF、Word、Excel 或 PowerPoint 文件，再从右键「快速操作」选择动作。第一次加锁时设置自己的编辑密码。</p>
<p>副本保存在原文件夹，分别追加「_已加锁」或「_已解锁」。同名时从「_2」开始编号。</p>
<p>加锁的 PDF 可以直接打开、打印和复制。PowerPoint 打开时可选择只读。需要打开密码的文件和旧版 Office 文件会跳过。</p>
<p>如果快捷键已被占用，请从右键菜单运行。</p>
</body>
